<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="리뷰노트·디너의여왕·강남맛집 체험단을 한 화면에서 골라 보는 개인용 대시보드">
<title>체험단 대시보드 · 구로·영등포·관악</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎁</text></svg>">
</head>
<body>
<header class="topbar">
  <div class="wrap topbar-inner">
    <div class="brand">
      <span class="logo">🎁</span>
      <div>
        <h1>체험단 대시보드</h1>
        <p class="sub">구로구 · 영등포구 · 관악구 중심 / 경쟁률 5:1 이상 · 4만 원 이상</p>
      </div>
    </div>
    <div class="topbar-right">
      <div class="updated" id="updated">업데이트 확인 중…</div>
      <button id="themeBtn" class="icon-btn" type="button" aria-label="다크 모드 전환" title="다크 모드 전환">🌙</button>
    </div>
  </div>
</header>

<main class="wrap">
  <section class="panel filters" aria-label="필터">
    <div class="filter-row">
      <div class="filter-group">
        <span class="filter-label">지역</span>
        <div class="chips" id="regionChips">
          <button class="chip on" data-region="구로구">구로구</button>
          <button class="chip on" data-region="영등포구">영등포구</button>
          <button class="chip on" data-region="관악구">관악구</button>
          <button class="chip" data-region="강서구">강서구</button>
          <button class="chip" data-region="__all__">서울 전체</button>
        </div>
      </div>
      <div class="filter-group">
        <span class="filter-label">유형</span>
        <div class="chips" id="kindChips">
          <button class="chip on" data-kind="방문형">방문형</button>
          <button class="chip" data-kind="배송형">배송형</button>
        </div>
      </div>
    </div>

    <div class="filter-row">
      <label class="range-group">
        <span class="filter-label">경쟁률 <b id="ratioVal">5.0</b>:1 이상</span>
        <input type="range" id="ratioRange" min="0" max="20" step="0.5" value="5">
      </label>
      <label class="range-group">
        <span class="filter-label">제공 금액 <b id="amountVal">4만 원</b> 이상</span>
        <input type="range" id="amountRange" min="0" max="200000" step="5000" value="40000">
      </label>
      <label class="switch">
        <input type="checkbox" id="noAmountToggle" checked>
        <span>금액 미표기 포함</span>
      </label>
      <label class="switch">
        <input type="checkbox" id="hideFaceToggle">
        <span>얼굴 노출 캠페인 숨기기</span>
      </label>
    </div>

    <div class="filter-row search-row">
      <input type="search" id="search" placeholder="🔍  제목·제공내역 검색 (예: 마사지, 베이커리, 필라테스)" autocomplete="off">
      <div class="sort-group">
        <select id="sort" aria-label="정렬">
          <option value="deadline">마감 임박순</option>
          <option value="ratio">경쟁률 높은순</option>
          <option value="amount">금액 높은순</option>
        </select>
        <button id="resetBtn" class="ghost-btn" type="button">초기화</button>
      </div>
    </div>
  </section>

  <div class="resultbar">
    <div id="count" class="count">불러오는 중…</div>
    <div class="legend">
      <span><i class="dot hot"></i>경쟁률 10:1↑</span>
      <span><i class="dot warm"></i>5:1↑</span>
      <span><i class="dot cool"></i>그 외</span>
    </div>
  </div>

  <div id="banner" class="banner" hidden></div>

  <section id="grid" class="grid" aria-live="polite"></section>

  <div id="empty" class="empty" hidden>
    <p class="empty-emoji">🫧</p>
    <p><b>조건에 맞는 캠페인이 없습니다.</b></p>
    <p class="muted">경쟁률·금액 기준을 낮추거나 ‘배송형’·‘서울 전체’를 켜 보세요.</p>
    <div class="empty-actions">
      <button class="ghost-btn" data-act="loosen">기준 낮추기</button>
      <button class="ghost-btn" data-act="delivery">배송형 보기</button>
      <button class="ghost-btn" data-act="reset">전체 보기</button>
    </div>
  </div>

  <div class="more-wrap"><button id="moreBtn" class="more-btn" type="button" hidden>더 보기</button></div>
</main>

<footer class="wrap foot">
  <p>리뷰노트 · 디너의여왕은 매일 09:00 / 15:00 / 21:00 자동 갱신, 강남맛집은 한국 IP에서 수동 갱신합니다.</p>
  <p class="muted">각 카드를 누르면 해당 사이트의 신청 페이지가 새 창으로 열립니다. 신청·로그인은 각 사이트에서 직접 진행하세요.</p>
</footer>

<script src="app.js"></script>
</body>
</html>
